<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Job Order | TechFix Pro</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="job-order-content">
            <!-- Job order content will be loaded here -->
        </div>
        <div class="no-print">
            <button onclick="window.print()">Print</button>
            <a href="list.html" class="btn">Back to List</a>
        </div>
    </div>
    <script src="../shared.js"></script>
    <script>
        // Load job order data based on URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('id');
        
        if (jobId) {
            const jobOrder = getJobOrderById(jobId);
            if (jobOrder) {
                document.getElementById('job-order-content').innerHTML = 
                    generateJobOrderHTML(jobOrder);
            }
        }
    </script>
</body>
</html>
