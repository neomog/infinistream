<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFix Pro Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #2c3e50;
            margin-top: 0;
        }
        .card p {
            color: #7f8c8d;
        }
        .btn {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 15px;
        }
        .btn:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>TechFix Pro</h1>
            <p>Computer Repair Management System</p>
        </div>
        
        <div class="card-container">
            <div class="card">
                <h2>Job Orders</h2>
                <p>Create and manage job orders for customer repairs</p>
                <a href="job-orders/create.html" class="btn">Create New</a>
                <a href="job-orders/list.html" class="btn">View All</a>
            </div>
            
            <div class="card">
                <h2>Invoices</h2>
                <p>Generate and manage customer invoices</p>
                <a href="invoices/create.html" class="btn">Create New</a>
                <a href="invoices/list.html" class="btn">View All</a>
            </div>
            
            <div class="card">
                <h2>Receipts</h2>
                <p>Record and manage customer payments</p>
                <a href="receipts/create.html" class="btn">Create New</a>
                <a href="receipts/list.html" class="btn">View All</a>
            </div>
        </div>
    </div>
</body>
</html>
