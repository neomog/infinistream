<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Receipt | TechFix Pro</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="container">
        <h1>Create New Receipt</h1>
        <form id="receipt-form">
            <div class="form-group">
                <label for="invoice">Select Invoice</label>
                <select id="invoice" required>
                    <option value="">-- Select Invoice --</option>
                    <!-- Options will be populated by JavaScript -->
                </select>
            </div>
            <!-- Other receipt fields -->
            <button type="submit">Create Receipt</button>
        </form>
        <a href="../index.html" class="btn">Back to Dashboard</a>
    </div>
    <script src="../shared.js"></script>
    <script src="receipts.js"></script>
</body>
